<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bảng Tuần Hoàn Hóa Học 3D</title>
    <!-- Thư viện Tailwind CSS để style giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            background-color: #000000;
            background-image: radial-gradient(circle at center, #0B1120 0%, #000000 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        /* Styling cho từng thẻ nguyên tố */
        .element {
            width: 140px;
            height: 180px;
            box-shadow: 0px 0px 15px rgba(0, 255, 255, 0.4);
            border: 1px solid rgba(127, 255, 255, 0.3);
            background-color: rgba(0, 40, 60, 0.7);
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.3s, border 0.3s, background-color 0.3s;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        .element:hover {
            box-shadow: 0px 0px 25px rgba(0, 255, 255, 0.9);
            border: 1px solid rgba(127, 255, 255, 0.9);
            background-color: rgba(0, 80, 100, 0.8);
            z-index: 1000;
        }

        .element .number {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            font-weight: bold;
            color: rgba(127, 255, 255, 0.9);
        }

        .element .symbol {
            position: absolute;
            top: 40px;
            left: 0px;
            right: 0px;
            font-size: 65px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        .element .details {
            position: absolute;
            bottom: 15px;
            left: 0px;
            right: 0px;
            font-size: 13px;
            color: rgba(127, 255, 255, 0.8);
        }

        .element .name {
            font-weight: 600;
            margin-bottom: 2px;
            color: #a5f3fc;
        }
        
        /* Menu điều khiển */
        #menu {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 15px;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        /* Khung chứa mã QR */
        #qr-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(127, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        #qr-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            border: 1px solid rgba(127, 255, 255, 0.8);
        }

        #qr-container img {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            margin-bottom: 6px;
            background-color: white; /* Nền trắng giúp mã QR dễ quét hơn */
            padding: 2px;
        }

        #qr-container span {
            font-size: 11px;
            font-weight: 500;
            color: #a5f3fc;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #element-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            touch-action: auto; /* Cho phép cuộn trên mobile */
        }
        #element-modal.active {
            opacity: 1; pointer-events: auto;
        }
        .modal-content {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 550px;
            position: relative;
            transform: translateY(30px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh;
            overflow-y: auto;
        }
        #element-modal.active .modal-content {
            transform: translateY(0) scale(1);
        }
        #close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            color: #a5f3fc;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            transition: all 0.3s;
        }
        #close-modal:hover {
            color: #fff;
            text-shadow: 0 0 10px #0ff;
            transform: scale(1.1);
        }
    </style>
</head>

        <button id="sphere" class="px-5 py-2 bg-transparent hover:bg-cyan-800 text-cyan-200 rounded-full font-medium transition-colors border border-cyan-800 hover:border-cyan-500">Hình Cầu</button>
        <button id="helix" class="px-5 py-2 bg-transparent hover:bg-cyan-800 text-cyan-200 rounded-full font-medium transition-colors border border-cyan-800 hover:border-cyan-500">Xoắn Ốc</button>
        <button id="grid" class="px-5 py-2 bg-transparent hover:bg-cyan-800 text-cyan-200 rounded-full font-medium transition-colors border border-cyan-800 hover:border-cyan-500">Lưới</button>

        // Cập nhật hàm tạo mã QR với URL cố định (Wikipedia)

            // Sử dụng URL cố định hợp lệ (Ví dụ: Wikipedia tiếng Việt về Bảng tuần hoàn)
            const fixedUrl = "https://vi.wikipedia.org/wiki/B%E1%BA%A3ng_tu%E1%BA%A7n_ho%C3%A0n";
            
            // Gọi API qrserver để tạo mã QR từ URL cố định
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(fixedUrl)}&margin=1`;
            
            // Gán ảnh QR vào thẻ img

        });

        function init() {
            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 3000;

            scene = new THREE.Scene();

            for (let i = 0; i < tableData.length; i += 5) {

                element.style.backgroundColor = `rgba(0, ${Math.random() * 80 + 40}, ${Math.random() * 80 + 100}, 0.7)`;

                number.className = 'number';
                number.textContent = (i / 5) + 1;
                element.appendChild(number);

                const symbol = document.createElement('div');
                symbol.className = 'symbol';
                symbol.textContent = tableData[i];
                element.appendChild(symbol);

                const details = document.createElement('div');
            details.className = 'details';
            details.innerHTML = `<div class="name">${tableData[i + 1]}</div>${tableData[i + 2]}`;
            element.appendChild(details);

            element.addEventListener('dblclick', () => {
                openElementModal({
                    symbol: tableData[i],
                    name: tableData[i + 1],
                    mass: tableData[i + 2],
                    number: (i / 5) + 1
                });
            });

            // Hỗ trợ chạm trên thiết bị di động
            let tapTimeout;
            element.addEventListener('touchend', (e) => {
                if (tapTimeout) {
                    clearTimeout(tapTimeout);
                    tapTimeout = null;
                    openElementModal({
                        symbol: tableData[i], name: tableData[i + 1], mass: tableData[i + 2], number: (i / 5) + 1
                    });
                } else {
                    tapTimeout = setTimeout(() => { tapTimeout = null; }, 300);
                }
            });

            const objectCSS = new THREE.CSS3DObject(element);
            objectCSS.position.x = Math.random() * 4000 - 2000;
                objectCSS.position.y = Math.random() * 4000 - 2000;
                objectCSS.position.z = Math.random() * 4000 - 2000;
                scene.add(objectCSS);
                objects.push(objectCSS);

                // 1. Tính toán tọa độ dạng Bảng (Table)
                const objectTable = new THREE.Object3D();
                objectTable.position.x = (tableData[i + 3] * 160) - 1530;
                objectTable.position.y = -(tableData[i + 4] * 200) + 990;
                targets.table.push(objectTable);
            }

            const vector = new THREE.Vector3();
            // 2. Tính toán dạng Hình Cầu (Sphere)
            for (let i = 0, l = objects.length; i < l; i++) {
                const phi = Math.acos(-1 + (2 * i) / l);
                const theta = Math.sqrt(l * Math.PI) * phi;
                
                const objectSphere = new THREE.Object3D();
                objectSphere.position.setFromSphericalCoords(800, phi, theta);
                
                vector.copy(objectSphere.position).multiplyScalar(2);
                objectSphere.lookAt(vector);
                targets.sphere.push(objectSphere);
            }

            // 3. Tính toán dạng Xoắn Ốc (Helix)
            const cylindrical = new THREE.Cylindrical();
            for (let i = 0, l = objects.length; i < l; i++) {
                const theta = i * 0.175 + Math.PI;
                const y = -(i * 8) + 450;
                
                const objectHelix = new THREE.Object3D();
                cylindrical.set(900, theta, y);
                objectHelix.position.setFromCylindrical(cylindrical);
                
                vector.x = objectHelix.position.x * 2;
                vector.y = objectHelix.position.y;
                vector.z = objectHelix.position.z * 2;
                objectHelix.lookAt(vector);
                targets.helix.push(objectHelix);
            }

            // 4. Tính toán dạng Lưới (Grid)
            for (let i = 0; i < objects.length; i++) {
                const objectGrid = new THREE.Object3D();
                objectGrid.position.x = ((i % 5) * 400) - 800;
                objectGrid.position.y = (-(Math.floor(i / 5) % 5) * 400) + 800;
                objectGrid.position.z = (Math.floor(i / 25)) * 1000 - 2000;
                targets.grid.push(objectGrid);
            }

            renderer = new THREE.CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.minDistance = 500;
            controls.maxDistance = 6000;
            controls.addEventListener('change', render);

            // Xử lý sự kiện các nút Menu
            const buttonTable = document.getElementById('table');
            const buttonSphere = document.getElementById('sphere');
            const buttonHelix = document.getElementById('helix');
            const buttonGrid = document.getElementById('grid');

            const allButtons = [buttonTable, buttonSphere, buttonHelix, buttonGrid];
            
            function setActiveButton(activeBtn) {
            allButtons.forEach(btn => {
                btn.classList.remove('bg-cyan-900', 'shadow-[0_0_10px_rgba(6,182,212,0.5)]');
                btn.classList.add('bg-transparent');
            });
            activeBtn.classList.remove('bg-transparent');
            activeBtn.classList.add('bg-cyan-900', 'shadow-[0_0_10px_rgba(6,182,212,0.5)]');
        }

        function openElementModal(data) {
            const modal = document.getElementById('element-modal');
            const modalBody = document.getElementById('modal-body');
            
            // Tìm dữ liệu chi tiết, nếu không có hiển thị thông báo mặc định
            const detail = elementDetailsData[data.symbol] || {
                electron: data.number,
                config: "Đang cập nhật...",
                physical: "Thông tin chi tiết về tính chất vật lý đang được cập nhật thêm.",
                chemical: "Thông tin chi tiết về tính chất hóa học đang được cập nhật thêm."
            };

            modalBody.innerHTML = `
                <div class="text-center mb-4">
                    <div class="text-6xl font-bold text-white drop-shadow-[0_0_15px_rgba(0,255,255,0.8)] mb-1">${data.symbol}</div>
                    <h2 class="text-2xl font-semibold text-cyan-300 border-b border-cyan-800/80 pb-2">${data.name}</h2>
                </div>
                
                <div class="grid grid-cols-2 gap-4 text-sm mb-5">
                    <div class="bg-slate-800/60 p-3 rounded-lg border border-cyan-900/50 shadow-inner">
                        <span class="text-cyan-600 font-semibold block mb-1">Số hiệu (Z)</span>
                        <span class="text-white text-lg font-bold">${data.number}</span>
                    </div>
                    <div class="bg-slate-800/60 p-3 rounded-lg border border-cyan-900/50 shadow-inner">
                        <span class="text-cyan-600 font-semibold block mb-1">Nguyên tử khối</span>
                        <span class="text-white text-lg font-bold">${data.mass}</span>
                    </div>
                    <div class="bg-slate-800/60 p-3 rounded-lg border border-cyan-900/50 shadow-inner">
                        <span class="text-cyan-600 font-semibold block mb-1">Số Electron</span>
                        <span class="text-white text-lg font-bold">${detail.electron}</span>
                    </div>
                    <div class="bg-slate-800/60 p-3 rounded-lg border border-cyan-900/50 shadow-inner">
                        <span class="text-cyan-600 font-semibold block mb-1">Cấu hình e</span>
                        <span class="text-yellow-300 text-lg font-mono">${detail.config}</span>
                    </div>
                </div>

                <div class="space-y-4 text-sm text-left">
                    <div class="bg-slate-800/60 p-4 rounded-lg border border-cyan-900/50">
                        <span class="text-cyan-400 font-semibold block mb-2 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block"></span> Tính chất vật lý
                        </span>
                        <p class="text-slate-200 leading-relaxed">${detail.physical}</p>
                    </div>
                    <div class="bg-slate-800/60 p-4 rounded-lg border border-cyan-900/50">
                        <span class="text-pink-400 font-semibold block mb-2 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-pink-400 inline-block"></span> Tính chất hóa học
                        </span>
                        <p class="text-slate-200 leading-relaxed">${detail.chemical}</p>
                    </div>
                </div>
            `;
            
            modal.classList.add('active');
        }

        // Đóng Modal khi bấm nút X
        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('element-modal').classList.remove('active');
        });

        // Đóng Modal khi bấm ra ngoài vùng tối
        document.getElementById('element-modal').addEventListener('click', (e) => {
            if (e.target.id === 'element-modal') {
                document.getElementById('element-modal').classList.remove('active');
            }
        });

        buttonTable.addEventListener('click', function () {
                transform(targets.table, 2000);
                setActiveButton(this);
            });

            buttonSphere.addEventListener('click', function () {
                transform(targets.sphere, 2000);
                setActiveButton(this);
            });

            buttonHelix.addEventListener('click', function () {
                transform(targets.helix, 2000);
                setActiveButton(this);
            });

            buttonGrid.addEventListener('click', function () {
                transform(targets.grid, 2000);
                setActiveButton(this);
            });

            // Chuyển sang Dạng Bảng làm mặc định lúc ban đầu
            transform(targets.table, 2000);

            window.addEventListener('resize', onWindowResize);
        }

        function transform(targets, duration) {
            TWEEN.removeAll();
            
            for (let i = 0; i < objects.length; i++) {
                const object = objects[i];
                const target = targets[i];
                
                new TWEEN.Tween(object.position)
                    .to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();
                    
                new TWEEN.Tween(object.rotation)
                    .to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();
            }
            
            new TWEEN.Tween(this)
                .to({}, duration * 2)
                .onUpdate(render)
                .start();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            render();
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
        }

        function render() {
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
